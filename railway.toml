[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node --max-old-space-size=80 --expose-gc --experimental-vm-modules src/index.js"
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10

[[volumes]]
mountPath = "/data"

[healthcheck]
path = "/api/state"
initialDelaySeconds = 10
periodSeconds = 30
timeoutSeconds = 5

[envVarPreconfigures]
PORT = "3000"
